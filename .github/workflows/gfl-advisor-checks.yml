name: GFL advisor checks
on:
  push:
    branches: [feat/gfl-tuning-advisor]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: gfl-advisor-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Unit tests
        run: npm test
      - name: Build static site
        run: npm run build
      - name: Audit static site
        run: npm run audit:static
      - name: Independent numeric check
        if: ${{ hashFiles('scripts/validate-gfl-advisor.py') != '' }}
        run: |
          python -m pip install numpy scipy
          node scripts/validate-gfl-advisor.mjs
          python scripts/validate-gfl-advisor.py
      - name: Browser checks
        if: ${{ hashFiles('scripts/browser-gfl-advisor.mjs') != '' }}
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/browser-gfl-advisor.mjs
      - name: Validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gfl-advisor-validation
          path: artifacts/gfl-advisor
          if-no-files-found: ignore
